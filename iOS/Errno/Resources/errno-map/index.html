<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><link rel="stylesheet" href="leaflet.css"><link rel="stylesheet" href="maplibre/maplibre-gl.css"><style>html,body,#map{height:100%;min-height:260px;margin:0;background:#eef2ee;font:14px system-ui}.leaflet-control-attribution{font-size:10px}.leaflet-maplibre-gl-layer{z-index:200}.status{position:absolute;z-index:900;top:8px;left:8px;right:8px;background:#fff;padding:8px 10px;border-radius:10px;box-shadow:0 2px 10px #0002}.error{color:#9b2727}#map{top:0}.leaflet-bottom{bottom:2px}</style></head><body><div id="map"></div><div class="status" id="status">Tap map to choose a location</div><script src="leaflet.js"></script><script src="maplibre/maplibre-gl.js"></script><script src="maplibre/leaflet-maplibre-gl.js"></script><script>
 (async()=>{'use strict';const q=new URLSearchParams(location.search);const photon=q.get('photon')||window.ERRNO_PHOTON_ENDPOINT||'https://photon.komoot.io',osrm=q.get('osrm')||window.ERRNO_OSRM_ENDPOINT||'https://router.project-osrm.org/route/v1/driving',tiles=q.get('tiles')||window.ERRNO_TILE_ENDPOINT||'https://tiles.openfreemap.org/planet',styleUrl=q.get('style')||window.ERRNO_MAP_STYLE_URL||tiles.replace(/\/planet\/?$/,'/styles/liberty');let map,marker,mode='picker',timer,controller,selected=null;const status=document.getElementById('status');
function tell(type,data){try{if(window.ErrnoMap&&window.ErrnoMap.onMapEvent)window.ErrnoMap.onMapEvent(JSON.stringify({type,...data}));if(window.webkit?.messageHandlers?.errnoMap)window.webkit.messageHandlers.errnoMap.postMessage({type,...data})}catch(_){}}
function setStatus(s,bad=false){status.textContent=s;status.className='status'+(bad?' error':'')}
function reverse(lat,lng){if(controller)controller.abort();controller=new AbortController();const req=controller;setStatus('Finding address…');const timeout=setTimeout(()=>req.abort('timeout'),10000);fetch(photon.replace(/\/$/, '')+'/reverse?lat='+lat+'&lon='+lng,{signal:req.signal,headers:{'Accept':'application/json'}}).finally(()=>clearTimeout(timeout)).then(r=>{if(r.status===429)throw Error('Search is busy. Enter the address manually.');if(!r.ok)throw Error('Address lookup unavailable. Enter the address manually.');return r.json()}).then(d=>{let p=d.features?.[0]?.properties||{},label=[p.name,p.housenumber,p.street,p.locality,p.city,p.state,p.postcode,p.country].filter(Boolean).filter((v,i,a)=>a.indexOf(v)===i).join(', ')||'Pinned location';setStatus(label);selected={latitude:lat,longitude:lng,address:label};tell('selection',selected)}).catch(e=>{if(e.name==='AbortError'&&req.signal.reason!=='timeout')return;setStatus('Map pin selected. '+(req.signal.reason==='timeout'?'Address lookup timed out. Enter manually.':e.message),true);selected={latitude:lat,longitude:lng,address:''};tell('selection',selected)})}
function place(latlng,geocode=true){if(!marker){marker=L.marker(latlng,{draggable:mode==='picker'}).addTo(map);marker.on('dragend',()=>{let p=marker.getLatLng();reverse(p.lat,p.lng)})}else marker.setLatLng(latlng);selected={latitude:latlng.lat,longitude:latlng.lng,address:''};if(geocode)reverse(latlng.lat,latlng.lng)}
function choose(latlng){place(latlng,true)}
function search(text){clearTimeout(timer);if(controller)controller.abort();if(text.trim().length<3){tell('results',{items:[]});return}timer=setTimeout(()=>{controller=new AbortController();const req=controller;let timeout=setTimeout(()=>req.abort('timeout'),10000);let url=photon.replace(/\/$/,'')+'/api/?q='+encodeURIComponent(text)+'&limit=6&lang=en';fetch(url,{signal:req.signal,headers:{'Accept':'application/json'}}).finally(()=>clearTimeout(timeout)).then(r=>{if(r.status===429)throw Error('Photon rate limit reached');if(!r.ok)throw Error('Search unavailable');return r.json()}).then(d=>tell('results',{items:(d.features||[]).map(f=>({label:[f.properties.name,f.properties.street,f.properties.city,f.properties.state,f.properties.country].filter(Boolean).filter((v,i,a)=>a.indexOf(v)===i).join(', '),latitude:f.geometry.coordinates[1],longitude:f.geometry.coordinates[0]}))})).catch(e=>{if(e.name!=='AbortError'||req.signal.reason==='timeout'){tell('results',{items:[],error:req.signal.reason==='timeout'?'Search timed out. Enter the address manually.':e.message})}})},350)}
window.ErrnoMapAPI={setLocation(lat,lng,address,geocode=false){if(!Number.isFinite(lat)||!Number.isFinite(lng)){setStatus(address||'Enter an address or select a pin');return}map.setView([lat,lng],15);place(L.latLng(lat,lng),geocode);if(address)setStatus(address)},search,select(item){map.setView([item.latitude,item.longitude],16);place(L.latLng(item.latitude,item.longitude),false);selected.address=item.label;setStatus(item.label);tell('selection',selected)},setMode(v){mode=v},setWorkers(rows){if(window.nearbyLayer)map.removeLayer(window.nearbyLayer);window.nearbyLayer=L.layerGroup();(rows||[]).forEach(w=>L.circleMarker([w.latitude,w.longitude],{radius:7,color:'#fff',weight:2,fillColor:'#2584d8',fillOpacity:.82}).bindTooltip('Available worker • approx. '+Number(w.distance_km||0).toFixed(1)+' km').addTo(window.nearbyLayer));window.nearbyLayer.addTo(map)},setWorker(lat,lng){if(window.assignedWorker)map.removeLayer(window.assignedWorker);window.assignedWorker=L.circleMarker([lat,lng],{radius:9,color:'#fff',weight:3,fillColor:'#1769aa',fillOpacity:1}).bindTooltip('Assigned worker').addTo(map);if(selected)map.fitBounds(L.latLngBounds([[lat,lng],[selected.latitude,selected.longitude]]),{padding:[30,30]});else map.setView([lat,lng],15)},async route(fromLat,fromLng,toLat,toLng){try{const r=await fetch(osrm.replace(/\/$/,'')+'/'+fromLng+','+fromLat+';'+toLng+','+toLat+'?overview=full&geometries=geojson');if(!r.ok)throw Error();const d=await r.json(),v=d.routes?.[0];if(!v)throw Error();this.setRoute(v.geometry.coordinates.map(c=>[c[1],c[0]]),v.distance/1000,v.duration/60)}catch(_){setStatus('Route service unavailable. Approximate ETA cannot be shown.',true)}},setRoute(coords,km,minutes){if(window.route)map.removeLayer(window.route);window.route=L.polyline(coords,{color:'#248a48',weight:5}).addTo(map);map.fitBounds(window.route.getBounds(),{padding:[24,24]});setStatus(km.toFixed(1)+' km • about '+Math.round(minutes)+' min (approximate, no live traffic)')}};
try{map=L.map('map',{zoomControl:true,minZoom:1,maxBounds:[[-85.051129,-180],[85.051129,180]],maxBoundsViscosity:1}).setView([20.5937,78.9629],5);map.attributionControl.addAttribution('© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors · © <a href="https://openfreemap.org">OpenFreeMap</a>');const baseLayer=L.maplibreGL({style:styleUrl,interactive:false}).addTo(map);const glMap=baseLayer.getMaplibreMap();glMap.on('load',()=>setStatus('Tap map to choose a location'));glMap.on('error',e=>{if(e?.error)setStatus('Map style or tiles unavailable. Enter the address manually.',true)});map.on('click',e=>choose(e.latlng));const lat=parseFloat(q.get('lat')),lng=parseFloat(q.get('lng'));if(Number.isFinite(lat)&&Number.isFinite(lng)){map.setView([lat,lng],14);place(L.latLng(lat,lng),false)}setTimeout(()=>map.invalidateSize(),150)}catch(e){setStatus('Map failed to load. You can enter the address manually.',true);tell('error',{message:String(e)})}
})();</script></body></html>
