# Use this migration environment only for a new canonical ERRNO schema.
# It requires ERRNO_DATABASE_URL explicitly and never loads Android/Backend/.env.

[alembic]
script_location = %(here)s/alembic_canonical
prepend_sys_path = .
path_separator = os
sqlalchemy.url = postgresql://

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
